name: PARKPOST CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GENEVIEVE_PARKPOST_CLEAN_WORKING_FINAL
    steps:
      - uses: actions/checkout@v4
      - run: test -s index.html
      - run: test -s app.js
      - run: test -s styles.css
      - run: test -s manifest.webmanifest
      - run: test -s _redirects
      - run: test ! -e vercel.json
      - run: test ! -e netlify.toml
      - run: node --check app.js
